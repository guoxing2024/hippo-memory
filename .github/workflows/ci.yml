name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build engine (tsc → dist)
        run: npm run build

      - name: Run engine + adapter tests
        run: npm test

      - name: Run anti-hallucination benchmark (smoke)
        run: node bench/smoke.mjs

      - name: Syntax-check adapter bundles
        run: node --check packages/dsh-hippo-memory/lib/index.js && node --check packages/dsh-hippo-memory/lib/client.js
